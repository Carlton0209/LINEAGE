services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: lineage
      POSTGRES_USER: lineage
      POSTGRES_PASSWORD: lineage
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lineage -d lineage"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    image: lineage-api-demo
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    environment:
      DATABASE_URL: postgresql+psycopg://lineage:lineage@postgres:5432/lineage
      LINEAGE_ENV: docker
      LINEAGE_CORS_ORIGINS: ${LINEAGE_CORS_ORIGINS:-http://localhost:3000}
      LINEAGE_ISSUER_ID: ${LINEAGE_ISSUER_ID:-lineage-local-dev}
      LINEAGE_ISSUER_NAME: ${LINEAGE_ISSUER_NAME:-LINEAGE Local Development Issuer}
      LINEAGE_ISSUER_URL: ${LINEAGE_ISSUER_URL:-https://lineage.dev}
      LINEAGE_KEY_ID: ${LINEAGE_KEY_ID:-lineage-local-dev-key-001}
      LINEAGE_ED25519_PRIVATE_KEY_B64URL: ${LINEAGE_ED25519_PRIVATE_KEY_B64URL:-zuecN0CTFU2KMXBastCGn103EQbyjze6oHwUlgv4Chg}
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=2).read()"
        ]
      interval: 5s
      timeout: 5s
      retries: 20

  seed:
    image: lineage-api-demo
    environment:
      DATABASE_URL: postgresql+psycopg://lineage:lineage@postgres:5432/lineage
      LINEAGE_ENV: docker
    command: ["lineage-seed-demo"]
    depends_on:
      api:
        condition: service_healthy
    restart: "no"

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    environment:
      NEXT_PUBLIC_API_URL: http://api:8000
    ports:
      - "3000:3000"
    depends_on:
      seed:
        condition: service_completed_successfully

volumes:
  postgres_data:
