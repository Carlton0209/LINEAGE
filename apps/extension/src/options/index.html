<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>LINEAGE Capture Options</title>
    <style>
      :root {
        color-scheme: dark;
        --ink: #0f1419;
        --cream: #f5f1ea;
        --terracotta: #e97451;
        --line: rgba(245, 241, 234, 0.16);
        --muted: rgba(245, 241, 234, 0.68);
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        background: var(--ink);
        color: var(--cream);
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }

      main {
        width: min(560px, calc(100vw - 32px));
        margin: 0 auto;
        padding: 56px 0;
      }

      header {
        display: flex;
        align-items: center;
        gap: 12px;
        margin-bottom: 32px;
      }

      .mark {
        width: 16px;
        height: 16px;
        border-radius: 999px;
        background: var(--terracotta);
        box-shadow: 0 0 0 8px rgba(233, 116, 81, 0.14);
      }

      h1 {
        margin: 0;
        font-size: 24px;
        font-weight: 650;
        letter-spacing: 0;
      }

      form {
        display: grid;
        gap: 18px;
      }

      label {
        display: grid;
        gap: 8px;
        color: var(--muted);
        font-size: 13px;
      }

      input {
        width: 100%;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: rgba(245, 241, 234, 0.06);
        color: var(--cream);
        font: inherit;
        padding: 12px 14px;
        outline: none;
      }

      input:focus {
        border-color: rgba(233, 116, 81, 0.78);
        box-shadow: 0 0 0 3px rgba(233, 116, 81, 0.16);
      }

      button {
        justify-self: start;
        border: 1px solid rgba(233, 116, 81, 0.6);
        border-radius: 999px;
        background: var(--terracotta);
        color: var(--ink);
        font: inherit;
        font-weight: 650;
        padding: 10px 18px;
        cursor: pointer;
      }

      .status {
        min-height: 20px;
        color: var(--cream);
        font-size: 13px;
      }
    </style>
  </head>
  <body>
    <main>
      <header>
        <span class="mark" aria-hidden="true"></span>
        <h1>LINEAGE Capture</h1>
      </header>

      <form id="settings-form">
        <label>
          Project ID
          <input id="project-id" name="projectId" type="text" placeholder="prj_demo_feature" autocomplete="off" />
        </label>

        <label>
          API URL
          <input id="api-url" name="apiUrl" type="text" autocomplete="off" />
        </label>

        <label>
          Operator ID
          <input id="operator-id" name="operatorId" type="text" autocomplete="off" />
        </label>

        <label>
          Default model
          <input id="default-model" name="defaultModel" type="text" autocomplete="off" />
        </label>

        <button type="submit">Save</button>
        <div id="status" class="status" role="status" aria-live="polite"></div>
      </form>
    </main>

    <script type="module" src="./options.js"></script>
  </body>
</html>
