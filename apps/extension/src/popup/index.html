<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>LINEAGE Capture</title>
    <style>
      :root {
        color-scheme: dark;
        --ink: #0f1419;
        --cream: #f5f1ea;
        --terracotta: #e97451;
        --line: rgba(245, 241, 234, 0.16);
        --muted: rgba(245, 241, 234, 0.68);
      }

      * {
        box-sizing: border-box;
      }

      body {
        width: 320px;
        margin: 0;
        background: var(--ink);
        color: var(--cream);
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }

      main {
        padding: 18px;
      }

      header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        margin-bottom: 18px;
      }

      .brand {
        display: flex;
        align-items: center;
        gap: 10px;
        min-width: 0;
      }

      .mark,
      .dot {
        border-radius: 999px;
      }

      .mark {
        width: 14px;
        height: 14px;
        flex: 0 0 auto;
        background: var(--terracotta);
        box-shadow: 0 0 0 7px rgba(233, 116, 81, 0.14);
      }

      h1 {
        margin: 0;
        font-size: 16px;
        font-weight: 650;
        letter-spacing: 0;
      }

      .options {
        border: 0;
        background: transparent;
        color: var(--muted);
        cursor: pointer;
        font: inherit;
        font-size: 12px;
        padding: 0;
      }

      .inline-link {
        max-width: 100%;
        border: 0;
        background: transparent;
        color: var(--cream);
        cursor: pointer;
        font: inherit;
        padding: 0;
        text-align: left;
      }

      dl {
        display: grid;
        gap: 8px;
        margin: 0 0 16px;
        padding: 12px;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: rgba(245, 241, 234, 0.05);
      }

      .setting {
        display: grid;
        gap: 3px;
      }

      dt {
        color: var(--muted);
        font-size: 11px;
      }

      dd {
        margin: 0;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
        font-size: 13px;
      }

      .capture {
        width: 100%;
        border: 1px solid rgba(233, 116, 81, 0.64);
        border-radius: 999px;
        background: var(--terracotta);
        color: var(--ink);
        cursor: pointer;
        font: inherit;
        font-weight: 650;
        padding: 10px 14px;
      }

      .capture:disabled {
        cursor: default;
        opacity: 0.54;
      }

      .status {
        min-height: 18px;
        margin: 10px 0 16px;
        color: var(--muted);
        font-size: 12px;
      }

      h2 {
        margin: 0 0 10px;
        font-size: 12px;
        font-weight: 650;
        color: var(--muted);
        letter-spacing: 0;
      }

      .log {
        display: grid;
        gap: 8px;
        margin: 0;
        padding: 0;
        list-style: none;
      }

      .log li {
        display: grid;
        grid-template-columns: 12px 1fr auto;
        align-items: center;
        gap: 8px;
        min-height: 28px;
        font-size: 12px;
      }

      .dot {
        width: 9px;
        height: 9px;
        border: 1px solid var(--terracotta);
      }

      .dot.ok {
        background: var(--terracotta);
      }

      .log-main {
        min-width: 0;
      }

      .tool {
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .time,
      .hash {
        color: var(--muted);
      }
    </style>
  </head>
  <body>
    <main>
      <header>
        <div class="brand">
          <span class="mark" aria-hidden="true"></span>
          <h1>LINEAGE Capture</h1>
        </div>
        <button id="options-link" class="options" type="button">Options</button>
      </header>

      <dl>
        <div class="setting">
          <dt>Project ID</dt>
          <dd id="project-id">Loading</dd>
        </div>
        <div class="setting">
          <dt>API URL</dt>
          <dd id="api-url">Loading</dd>
        </div>
      </dl>

      <button id="capture-button" class="capture" type="button">Capture latest generation</button>
      <div id="status" class="status" role="status" aria-live="polite"></div>

      <h2>Recent captures</h2>
      <ul id="capture-log" class="log"></ul>
    </main>

    <script type="module" src="./popup.js"></script>
  </body>
</html>
